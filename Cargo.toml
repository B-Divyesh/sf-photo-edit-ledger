[package]
name = "sidecar-ledger"
version = "0.1.0"
edition = "2024"
description = "A local preflight for photo and XMP metadata handoffs"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-photo-edit-ledger"
readme = "README.md"
keywords = ["photography", "xmp", "metadata", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["site/", "dist/", ".factory/"]

[[bin]]
name = "sidecar-ledger"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
